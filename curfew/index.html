/* Layout: one 1920×1080 stage scaled to fit (letterboxed on #050505), three stacked SVG layers: base (under the lamp), lit (masked by the lamp), ui (always on top). */
:root{

html,body{height:100%;margin:0;background:var(--ink);overflow:hidden}
body{color:var(--bone)}

.scene{position:fixed;inset:0;background:var(--ink)}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block}
#base,#lit{pointer-events:none}
#lit{

}
#ui{pointer-events:none}
#ui a{pointer-events:auto;outline:none}
#ui a .hit{fill:transparent}
#ui a:focus-visible .hit{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3}
#cta .arrow{transition:transform .35s cubic-bezier(.2,.8,.2,1)}

      <path id="ctaP" d="M1705.43 1040H1702.11V1020.99H1709.36C1713.68 1020.99 1716.2 1023.18 1716.2 1026.92C1716.2 1029.47 1715 1031.29 1712.77 1032.2L1716.38 1040H1712.74L1709.52 1032.9H1705.43V1040ZM1705.43 1023.96V1029.96H1709.36C1711.47 1029.96 1712.71 1028.85 1712.71 1026.92C1712.71 1025.02 1711.47 1023.96 1709.36 1023.96H1705.43ZM1731.33 1040H1719.52V1020.99H1731.33V1024.06H1722.85V1028.95H1730.44V1031.89H1722.85V1036.93H1731.33V1040ZM1738.16 1040H1734.94V1020.99H1738.16L1744.3 1036.13L1750.43 1020.99H1753.71V1040H1750.48V1034.15C1750.48 1030.33 1750.48 1029.21 1750.67 1027.86L1745.83 1040H1742.76L1737.95 1027.88C1738.13 1029.03 1738.16 1030.82 1738.16 1033.19V1040ZM1761.24 1020.99V1040H1757.91V1020.99H1761.24ZM1768.73 1040H1765.46V1020.99H1768.76L1777.68 1034.46V1020.99H1780.95V1040H1777.68L1768.73 1026.53V1040ZM1792 1040H1785.16V1020.99H1791.81C1797.43 1020.99 1801.3 1024.87 1801.3 1030.54C1801.3 1036.13 1797.51 1040 1792 1040ZM1791.5 1024.06H1788.49V1036.93H1791.68C1795.48 1036.93 1797.79 1034.49 1797.79 1030.54C1797.79 1026.51 1795.43 1024.06 1791.5 1024.06ZM1814.64 1040H1811.41V1020.99H1814.64L1820.77 1036.13L1826.91 1020.99H1830.18V1040H1826.96V1034.15C1826.96 1030.33 1826.96 1029.21 1827.14 1027.86L1822.31 1040H1819.24L1814.43 1027.88C1814.61 1029.03 1814.64 1030.82 1814.64 1033.19V1040ZM1846.2 1040H1834.39V1020.99H1846.2V1024.06H1837.72V1028.95H1845.31V1031.89H1837.72V1036.93H1846.2V1040Z" fill="#ECE7DD"/>
      <g class="arrow"><path id="arrowP" d="M1873.28 1025.92H1876.24V1039.83H1862.36V1036.84H1871.17L1857 1022.67L1859.08 1020.56L1873.28 1034.73V1025.92Z" fill="#FF5A1F" opacity="0"/></g>
      <line id="under" x1="1697" y1="1050.25" x2="1880" y2="1050.25" stroke="#ECE7DD" stroke-width="1.5" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1"/>
    </a>
  </svg>
</main>
<div class="cur-ring" id="ring"></div><div class="cur-dot" id="cdot"></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const lit=$('lit'), wordDim=$('wordDim'), blurStd=$('blurStd'), counter=$('counter');
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const easeOut=t=>1-Math.pow(1-t,3);
const CHARS='ABCDEFGHJKLMNPRSTUVWXYZ0123456789#%&*/+<>=?';
const rc=()=>CHARS[(Math.random()*CHARS.length)|0];

/* ---------- stage geometry (viewport px <-> 1920×1080 units) ---------- */
let sc=1,ox=0,oy=0;
function measure(){sc=Math.min(innerWidth/1920,innerHeight/1080);ox=(innerWidth-1920*sc)/2;oy=(innerHeight-1080*sc)/2}
measure();addEventListener('resize',measure);

/* ---------- split outlined text into per-glyph paths ---------- */
function splitGlyphs(path){
  const d=path.getAttribute('d'), fill=path.getAttribute('fill'), parent=path.parentNode;
  const subs=d.match(/M[^M]*/g)||[d];
  const tmp=subs.map(sd=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',sd);parent.insertBefore(p,path);const b=p.getBBox();return{sd,b,p}});
  tmp.sort((a,b)=>a.b.x-b.b.x);
  const cl=[];
  for(const t of tmp){const c=cl[cl.length-1];
    if(c && t.b.x < c.x2-0.2){c.ds.push(t.sd);c.x2=Math.max(c.x2,t.b.x+t.b.width);c.y1=Math.min(c.y1,t.b.y);c.y2=Math.max(c.y2,t.b.y+t.b.height)}
    else cl.push({ds:[t.sd],x1:t.b.x,x2:t.b.x+t.b.width,y1:t.b.y,y2:t.b.y+t.b.height})}
  tmp.forEach(t=>t.p.remove());
  const box=path.getBBox();
  const g=document.createElementNS(NS,'g');g.setAttribute('id',path.id+'G');parent.insertBefore(g,path);path.remove();
  return cl.map(c=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',c.ds.join(''));p.setAttribute('fill',fill);p.setAttribute('opacity','0');g.appendChild(p);
    return{el:p,cx:(c.x1+c.x2)/2,fill,lineY:box.y+box.height/2,lineH:box.height,parent:g}});
}
const G={};
['lights','hint','navA','navL','navC','logoP','drop','ctaP'].forEach(id=>G[id]=splitGlyphs($(id)));
/* bright copies of the nav for inside the lamp */
const navLit=$('navLit'); const twins=new Map();
['navA','navL','navC'].forEach(id=>G[id].forEach(gl=>{const c=gl.el.cloneNode();c.setAttribute('fill','#ECE7DD');navLit.appendChild(c);twins.set(gl.el,c)}));
const showGlyph=(gl,o=1)=>{gl.el.setAttribute('opacity',o);const t=twins.get(gl.el);if(t)t.setAttribute('opacity',o)};

/* keyboard focus brightens nav even when the lamp is elsewhere */
[['lnkA','navA'],['lnkL','navL'],['lnkC','navC']].forEach(([a,n])=>{
  $(a).addEventListener('focus',()=>G[n].forEach(g=>g.el.setAttribute('fill','#ECE7DD')));
  $(a).addEventListener('blur',()=>G[n].forEach(g=>g.el.setAttribute('fill','#6F6F6F')));
});
document.querySelectorAll('#ui a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();if(a.id==='cta')flickerTap()}));

/* ---------- glyph decoder ("assembled from symbols") ---------- */
const decoding=[];
function decode(glyphs,start,{stagger=26,dur=[220,520]}={}){
  glyphs.forEach((gl,i)=>decoding.push({gl,s:start+i*stagger+rnd(0,40),d:rnd(dur[0],dur[1]),txt:null,last:0}));
}
function tickDecode(now){
  for(let i=decoding.length-1;i>=0;i--){const q=decoding[i];
    if(now<q.s)continue;
    if(!q.txt){const t=document.createElementNS(NS,'text');t.setAttribute('class','scr');t.setAttribute('x',q.gl.cx);t.setAttribute('y',q.gl.lineY);
      t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','central');t.setAttribute('font-size',Math.max(9,q.gl.lineH*1.25));
      t.setAttribute('fill',q.gl.fill==='#3A3A3A'?'#5a5a5a':q.gl.fill);q.gl.parent.appendChild(t);q.txt=t}
    if(now>=q.s+q.d){q.txt.remove();showGlyph(q.gl,1);decoding.splice(i,1);continue}
    if(now-q.last>42){q.txt.textContent=rc();q.txt.setAttribute('opacity',rnd(.45,1).toFixed(2));q.last=now}
  }
}

/* ---------- lamp ---------- */
const DEF={x:1358,y:540}, R=300;
const lamp={x:DEF.x,y:DEF.y,tx:DEF.x,ty:DEF.y,I:0,rm:1,speedM:1,bright:1};
let seq=null; // flicker sequence: [[intensity,ms],...] ; last item holds
function play(s,now){seq={s,i:0,t:now}}
function seqI(now){
  if(!seq)return null;
  while(seq.i<seq.s.length-1 && now-seq.t>seq.s[seq.i][1]){seq.t+=seq.s[seq.i][1];seq.i++}
  const cur=seq.s[seq.i], v=cur[0];
  if(seq.i===seq.s.length-1 && (cur[1]===Infinity || now-seq.t>cur[1])) seq=null;
  return v;
}
function flickerTap(){if(!booted||reduce)return;play([[.3,45],[1,60],[.55,35],[1,Infinity]],performance.now())}

/* ---------- loading progress ---------- */
let loaded=false, p=0, tReady=0, booted=false, bootAt=0, finished=false;
const img=new Image(); img.src='photo.jpg';
Promise.all([img.decode().catch(()=>{}),document.fonts?document.fonts.ready.catch(()=>{}):0]).then(()=>{loaded=true});

/* ---------- pointer + cursor ---------- */
const dot=$('cdot'), ring=$('ring'); let px=-100,py=-100,rx=-100,ry=-100, moved=false, lastMove=0, driftPh=null, driftT=0;
addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;lastMove=performance.now();moved=true;driftPh=null;
  if(booted){lamp.tx=(px-ox)/sc;lamp.ty=(py-oy)/sc}
  dot.style.opacity=ring.style.opacity=1},{passive:true});
document.addEventListener('pointerleave',()=>{dot.style.opacity=ring.style.opacity=0});
document.querySelectorAll('#ui a').forEach(a=>{a.addEventListener('pointerenter',()=>ring.classList.add('on-link'));a.addEventListener('pointerleave',()=>ring.classList.remove('on-link'))});

/* ---------- boot ---------- */
function boot(now){
  booted=true;bootAt=now;
  if(moved){lamp.tx=(px-ox)/sc;lamp.ty=(py-oy)/sc}
  if(reduce){seq=null;lamp.I=1;revealAll();return}
  play([[.9,45],[0,70],[.45,30],[0,110],[1,Infinity]],now);
}
function revealAll(){Object.values(G).flat().forEach(g=>showGlyph(g,1));timerEl.setAttribute('opacity',1);$('dot').setAttribute('opacity',1);$('arrowP').setAttribute('opacity',1);
  $('under').setAttribute('stroke-dashoffset',0);counter.textContent='';wordDim.setAttribute('filter','url(#tex)');wordDim.setAttribute('opacity',1);wordDim.setAttribute('fill','#1A1A1A');finished=true}
let uiStarted=false, counterOut=0;
function startUI(now){
  uiStarted=true;
  const F={stagger:12,dur:[150,300]};
  decode([...G.navA,...G.navL,...G.navC],now,F);
  decode(G.logoP,now+40,{stagger:40,dur:[200,320]});
  decode(G.lights,now+90,F);
  decode(G.drop,now+130,F);
  timerScr=now+190;
  decode(G.ctaP,now+230,{stagger:22,dur:[150,300]});
  counterOut=now;          // counter scrambles away, the hint decodes in its place
  decode(G.hint,now+200,F);
  dotBlink=now+150;
}
let dotBlink=0, nextFlick=0, nextAmb=0;

/* ---------- live countdown: Oct 24 2026, 7 PM Kyiv (UTC+3) ---------- */
const timerEl=$('timerT'), DROP=Date.UTC(2026,9,24,16,0,0);
const DEMO=((9*24+22)*60+11)*60*1000, demoEnd=Date.now()+DEMO;   // after the drop date, keep the mockup's 09D 22H 11M 00S ticking
let timerScr=0, timerTxt='';
const pad2=n=>String(n).padStart(2,'0');
function timerString(){
  const now=Date.now(); let ms=DROP-now; if(ms<=0) ms=demoEnd-now; ms=Math.max(0,ms);
  let s=Math.floor(ms/1000); const d=Math.floor(s/86400); s%=86400; const h=Math.floor(s/3600); s%=3600; const m=Math.floor(s/60); s%=60;
  return `${pad2(d)}D ${pad2(h)}H ${pad2(m)}M ${pad2(s)}S`;
}
function tickTimer(now){
  const real=timerString();
  if(timerScr){
    const t=now-timerScr; if(t<0) return;
    timerEl.setAttribute('opacity',1);
    if(t<320){ if(now-(tickTimer.l||0)>42){tickTimer.l=now; timerEl.textContent=real.replace(/[^ ]/g,(c,i)=>Math.random()<t/320?c:rc())} return }
    timerScr=0;
  }
  if(real!==timerTxt && +timerEl.getAttribute('opacity')>0){timerTxt=real; timerEl.textContent=real}
}

/* ---------- main loop ---------- */
const t0=performance.now(); let last=t0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; const el=(now-t0)/1000;

  if(!booted){
    /* progress: eased, with a small stall near 45%, held at 90% until the photo is ready */
    let target=.9*easeOut(clamp(el/1.0));
    if(loaded && el>1.0){ if(!tReady)tReady=now; target=Math.min(1,.9+(now-tReady)/200*.1) }
    p+= (target-p)*Math.min(1,dt*14); if(target>=1 && 1-p<.004)p=1;
    counter.textContent='LOADING '+String(Math.floor(p*100)).padStart(3,'0');

    /* word: blur-in, breathe, settle to its final colour at 90% */
    const a=clamp(el/.5); wordDim.setAttribute('opacity',easeOut(a).toFixed(3));
    blurStd.setAttribute('stdDeviation',(14*(1-easeOut(a))).toFixed(2));
    const amp=1-clamp(p/.9), wave=.5-.5*Math.cos(el*9);
    const c=Math.round(lerp(0x1A,0x4A,amp*wave)).toString(16).padStart(2,'0');
    wordDim.setAttribute('fill','#'+c+c+c);

    /* the dead bulb: rare stutters that get frequent near the end */
    if(!reduce && el>.4 && now>nextFlick && !seq && p<.97){
      const n=1+Math.round(p*2), s=[];
      for(let i=0;i<n;i++){s.push([rnd(.15,.4)+p*.35,rnd(25,60)]);s.push([0,rnd(35,80)])}
      play(s,now); nextFlick=now+lerp(420,160,p)*rnd(.8,1.2);
    }
    if(reduce && loaded) p=1;
    if(p>=1 && el>1.1 && !seq) boot(now);
  }

  /* intensity */
  const si=seqI(now); if(si!==null) lamp.I=si; else if(!booted) lamp.I=0;

  if(booted && !reduce){
    const ts=(now-bootAt-255)/1000; // the last "on" lands 255ms after boot
    if(ts>=0){
      if(!uiStarted) startUI(now);
      lamp.rm=1-.18*Math.exp(-9*ts)*Math.cos(16*ts);     // light pops on with a spring
      lamp.bright=1+.45*Math.exp(-6*ts);
      if(!nextAmb) nextAmb=now+rnd(8000,14000);
    } else { lamp.rm=.85; lamp.bright=1.25 }
    /* old bulb, still alive: a rare stutter while you look around */
    if(nextAmb && now>nextAmb && !seq){play([[.35,40],[1,70],[.6,30],[1,Infinity]],now);nextAmb=now+rnd(9000,16000)}
  }

  /* follow + idle drift */
  if(booted){
    if(now-Math.max(lastMove,bootAt)>6000){
      if(driftPh===null){driftPh=Math.asin(clamp((lamp.x-960)/520,-1,1));driftT=0}
      driftT+=dt; lamp.tx=960+520*Math.sin(driftPh+driftT*.33); lamp.ty=550+55*Math.sin(driftT*.57);
    }
    const k=1-Math.exp(-dt*8), dx=(lamp.tx-lamp.x)*k, dy=(lamp.ty-lamp.y)*k;
    lamp.x+=dx; lamp.y+=dy;
    const sp=Math.hypot(dx,dy)/Math.max(dt,.001);
    lamp.speedM+= ((1-Math.min(.12,sp/14000))-lamp.speedM)*Math.min(1,dt*6);
  }

  /* dot: blinks twice, then stays on */
  if(dotBlink){const t=now-dotBlink; $('dot').setAttribute('opacity', t<0?0: t<360? ((t/90|0)%2?0:1):1); if(t>360)dotBlink=0}
  /* CTA underline + arrow */
  if(uiStarted && !finished){const t=(now-(bootAt+255+420))/1000;
    $('under').setAttribute('stroke-dashoffset',(1-easeOut(clamp(t/.4))).toFixed(3));
    const ta=clamp((t-.2)/.3); $('arrowP').setAttribute('opacity',ta.toFixed(2)); {const k=(-10*(1-easeOut(ta))).toFixed(1);$('arrowP').setAttribute('transform',`translate(${k} ${k})`)}
    if(t>.8 && !decoding.length){finished=true;wordDim.setAttribute('filter','url(#tex)')}
  }
  /* counter scramble-out */
  if(counterOut){const t=now-counterOut; if(t<240){counter.textContent=counter.textContent.replace(/[^ ]/g,()=>Math.random()<t/240?' ':rc())}else{counter.textContent='';counterOut=0}}
  if(booted) wordDim.setAttribute('fill','#1A1A1A');

  tickDecode(now); tickTimer(now);

  /* write lamp to the mask */
  lit.style.setProperty('--x',(ox+lamp.x*sc).toFixed(1)+'px');
  lit.style.setProperty('--y',(oy+lamp.y*sc).toFixed(1)+'px');
  lit.style.setProperty('--r',(R*lamp.rm*lamp.speedM*sc).toFixed(1)+'px');
  lit.style.opacity=lamp.I.toFixed(3);
  lit.style.filter=lamp.bright>1.01?`brightness(${lamp.bright.toFixed(3)})`:'';

  /* cursor */
  rx+=(px-rx)*Math.min(1,dt*14); ry+=(py-ry)*Math.min(1,dt*14);
  dot.style.transform=`translate(${px}px,${py}px)`; ring.style.transform=`translate(${rx}px,${ry}px)`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
